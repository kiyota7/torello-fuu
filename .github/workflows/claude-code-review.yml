name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# 同一PRで連続pushされた場合は古い実行をキャンセルする
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # forkからのPRはSecretsが渡されないため対象外。Draftも除外
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write # claude-code-actionがGitHub App認証を取得するために必要
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          # push のたびに同じコメントを更新し、PRがコメントだらけになるのを防ぐ
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            このPull Requestをレビューし、結果を日本語でPRにコメントしてください。

            観点:
            - バグ・ロジックの誤り・エッジケース
            - セキュリティ(認証情報の埋め込み、入力検証、権限設定など)
            - パフォーマンス
            - 可読性・保守性、既存コードの流儀との整合
            - テストの不足

            ルール:
            - `gh pr diff` で差分を確認し、変更された部分に絞って指摘する
            - terraform/ 配下(*.tf, *.tfvars, *.tpl)に変更がある場合は、
              .claude/skills/terraform-review/SKILL.md の観点に従う
            - 重大度(Must / Should / Nit)を付けて優先度順に並べる
            - 問題がなければ「指摘事項なし」と簡潔に書く
            - 具体的な行に対する指摘はインラインコメントを使い、全体所見のみPRコメントにまとめる
            - コードの修正やコミットはしない(レビューのみ)
          claude_args: |
            --max-turns 10
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
